<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UsTube - Видеоплатформа</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #0f0f0f; color: white; }
        
        /* Шапка */
        .header { 
            background: #202020; 
            padding: 0 16px; 
            height: 56px; 
            display: flex; 
            align-items: center; 
            position: fixed; 
            top: 0; 
            left: 0; 
            right: 0; 
            z-index: 1000; 
        }
        .logo { color: #ff0000; font-size: 24px; font-weight: bold; margin-right: 40px; }
        .search { flex: 1; max-width: 600px; margin: 0 40px; }
        .search input { 
            width: 100%; 
            padding: 10px 20px; 
            background: #121212; 
            border: 1px solid #303030; 
            border-radius: 20px; 
            color: white; 
        }
        
        /* Основной контент */
        .main { margin-top: 56px; padding: 20px; }
        .video-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
            gap: 20px; 
            margin-top: 20px; 
        }
        .video-card { 
            background: transparent; 
            cursor: pointer; 
            transition: transform 0.2s; 
        }
        .video-card:hover { transform: scale(1.02); }
        .thumbnail { 
            width: 100%; 
            aspect-ratio: 16/9; 
            background: #303030; 
            border-radius: 10px; 
            margin-bottom: 10px; 
            overflow: hidden; 
        }
        .thumbnail img { width: 100%; height: 100%; object-fit: cover; }
        .video-info { display: flex; }
        .channel-avatar { 
            width: 36px; 
            height: 36px; 
            border-radius: 50%; 
            background: #ff0000; 
            margin-right: 12px; 
            flex-shrink: 0; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: bold; 
        }
        
        /* Модальные окна */
        .modal { 
            position: fixed; 
            top: 0; left: 0; right: 0; bottom: 0; 
            background: rgba(0,0,0,0.8); 
            display: none; 
            align-items: center; 
            justify-content: center; 
            z-index: 2000; 
        }
        .modal-content { 
            background: #202020; 
            padding: 30px; 
            border-radius: 10px; 
            width: 90%; 
            max-width: 500px; 
        }
        .modal input, .modal textarea, .modal select { 
            width: 100%; 
            padding: 10px; 
            margin: 10px 0; 
            background: #121212; 
            border: 1px solid #303030; 
            border-radius: 5px; 
            color: white; 
        }
        .btn { 
            padding: 10px 20px; 
            background: #ff0000; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            font-weight: bold; 
            margin: 5px; 
        }
        .btn.secondary { background: #303030; }
        
        /* Страница видео */
        .video-page { max-width: 1200px; margin: 0 auto; }
        .video-player { 
            width: 100%; 
            aspect-ratio: 16/9; 
            background: #000; 
            border-radius: 10px; 
            margin-bottom: 20px; 
        }
        .video-player video { width: 100%; height: 100%; }
        
        /* Адаптивность */
        @media (max-width: 768px) {
            .video-grid { grid-template-columns: 1fr; }
            .search { margin: 0 10px; }
        }
    </style>
</head>
<body>
    <!-- Шапка -->
    <div class="header">
        <div class="logo">UsTube</div>
        <div class="search">
            <input type="text" id="searchInput" placeholder="Поиск видео...">
        </div>
        <button class="btn" onclick="showModal('uploadModal')">Загрузить</button>
        <button class="btn secondary" onclick="showModal('authModal')" id="authBtn">Войти</button>
    </div>
    
    <!-- Основной контент -->
    <div class="main" id="mainContent">
        <!-- Контент загружается динамически -->
    </div>
    
    <!-- Модальное окно авторизации -->
    <div class="modal" id="authModal">
        <div class="modal-content">
            <h2>Вход в UsTube</h2>
            <div id="loginForm">
                <input type="email" id="loginEmail" placeholder="Email">
                <input type="password" id="loginPassword" placeholder="Пароль">
                <button class="btn" onclick="login()">Войти</button>
                <button class="btn secondary" onclick="showRegister()">Регистрация</button>
                <button class="btn secondary" onclick="showAdminLogin()">Админ вход</button>
            </div>
            <div id="registerForm" style="display: none;">
                <input type="text" id="regUsername" placeholder="Имя пользователя">
                <input type="email" id="regEmail" placeholder="Email">
                <input type="password" id="regPassword" placeholder="Пароль">
                <button class="btn" onclick="register()">Зарегистрироваться</button>
                <button class="btn secondary" onclick="showLogin()">Назад к входу</button>
            </div>
            <div id="adminLoginForm" style="display: none;">
                <input type="text" id="adminUsername" placeholder="Имя администратора">
                <input type="password" id="adminPassword" placeholder="Пароль">
                <button class="btn" onclick="adminLogin()">Войти как администратор</button>
                <button class="btn secondary" onclick="showLogin()">Назад</button>
            </div>
        </div>
    </div>
    
    <!-- Модальное окно загрузки видео -->
    <div class="modal" id="uploadModal">
        <div class="modal-content">
            <h2>Загрузить видео</h2>
            <input type="text" id="videoTitle" placeholder="Название видео">
            <textarea id="videoDescription" placeholder="Описание" rows="4"></textarea>
            <select id="videoCategory">
                <option value="">Выберите категорию</option>
                <option value="entertainment">Развлечения</option>
                <option value="music">Музыка</option>
                <option value="gaming">Игры</option>
                <option value="education">Образование</option>
            </select>
            <div style="background: #121212; padding: 20px; border-radius: 5px; margin: 10px 0; text-align: center;">
                <div style="font-size: 48px;">📤</div>
                <p>Вставьте ссылку на видео (YouTube, Vimeo и т.д.)</p>
                <input type="text" id="videoUrl" placeholder="https://...">
                <p style="margin-top: 10px; font-size: 14px; color: #aaa;">Или выберите файл:</p>
                <input type="file" id="videoFile" accept="video/*" style="margin-top: 5px;">
            </div>
            <button class="btn" onclick="uploadVideo()">Опубликовать</button>
            <button class="btn secondary" onclick="hideModal('uploadModal')">Отмена</button>
        </div>
    </div>
    
    <!-- Админ панель -->
    <div class="modal" id="adminModal">
        <div class="modal-content" style="max-width: 800px;">
            <h2>🔧 Админ панель UsTube</h2>
            <div id="adminContent">
                <!-- Контент админ панели -->
            </div>
            <button class="btn secondary" onclick="hideModal('adminModal')">Закрыть</button>
        </div>
    </div>

    <script>
        // Глобальные переменные
        let currentUser = null;
        let currentVideo = null;
        const API_URL = 'http://localhost:3000/api';
        
        // Инициализация
        window.onload = function() {
            loadHomePage();
        };
        
        // Управление модальными окнами
        function showModal(id) {
            document.getElementById(id).style.display = 'flex';
        }
        
        function hideModal(id) {
            document.getElementById(id).style.display = 'none';
        }
        
        // Загрузка главной страницы
        async function loadHomePage() {
            const response = await fetch(`${API_URL}/videos?limit=20`);
            const videos = await response.json();
            
            let html = '<h1>🎬 Рекомендованные видео</h1>';
            html += '<div class="video-grid">';
            
            videos.forEach(video => {
                html += `
                    <div class="video-card" onclick="watchVideo('${video.id}')">
                        <div class="thumbnail">
                            <img src="https://picsum.photos/300/169?random=${video.id}" 
                                 alt="${video.title}"
                                 onerror="this.src='https://picsum.photos/300/169?random=${video.id}'">
                        </div>
                        <div class="video-info">
                            <div class="channel-avatar">${video.channel?.name?.charAt(0) || 'U'}</div>
                            <div>
                                <h4>${video.title}</h4>
                                <p style="color: #aaa; font-size: 14px;">${video.channel?.name || 'Канал'}</p>
                                <p style="color: #aaa; font-size: 12px;">${formatNumber(video.views)} просмотров</p>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            html += '</div>';
            document.getElementById('mainContent').innerHTML = html;
        }
        
        // Просмотр видео
        async function watchVideo(videoId) {
            const response = await fetch(`${API_URL}/videos/${videoId}`);
            const video = await response.json();
            currentVideo = video;
            
            let html = `
                <div class="video-page">
                    <div class="video-player">
                        <video controls autoplay>
                            <source src="${video.videoUrl || `https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4`}" type="video/mp4">
                        </video>
                    </div>
                    <h1>${video.title}</h1>
                    <div style="display: flex; align-items: center; margin: 20px 0;">
                        <div class="channel-avatar" style="width: 50px; height: 50px; font-size: 20px;">
                            ${video.channel?.name?.charAt(0) || 'U'}
                        </div>
                        <div style="margin-left: 15px; flex: 1;">
                            <h3>${video.channel?.name || 'Канал'}</h3>
                            <p style="color: #aaa;">${formatNumber(video.channel?.subscribers || 0)} подписчиков</p>
                        </div>
                        <button class="btn" id="subscribeBtn" onclick="toggleSubscribe('${video.channel?.id}')">
                            Подписаться
                        </button>
                    </div>
                    <div style="background: #202020; padding: 20px; border-radius: 10px; margin: 20px 0;">
                        <p>${video.description || 'Описание отсутствует'}</p>
                        <div style="margin-top: 15px; color: #aaa;">
                            ${formatNumber(video.views)} просмотров • ${new Date(video.createdAt).toLocaleDateString()}
                        </div>
                    </div>
                    <div style="display: flex; gap: 10px; margin: 20px 0;">
                        <button class="btn secondary" onclick="likeVideo(1)">
                            👍 ${formatNumber(video.likes)}
                        </button>
                        <button class="btn secondary" onclick="likeVideo(-1)">
                            👎 ${formatNumber(video.dislikes)}
                        </button>
                        <button class="btn secondary" onclick="shareVideo()">
                            📤 Поделиться
                        </button>
                    </div>
                    <div style="margin-top: 40px;">
                        <h3>💬 Комментарии (${video.comments?.length || 0})</h3>
                        <div style="display: flex; margin: 20px 0;">
                            <div class="channel-avatar" style="margin-right: 10px;">
                                ${currentUser?.username?.charAt(0) || '?'}
                            </div>
                            <input type="text" 
                                   id="commentInput" 
                                   placeholder="Добавить комментарий..." 
                                   style="flex: 1; padding: 10px; background: #202020; border: 1px solid #303030; border-radius: 20px; color: white;"
                                   onkeypress="if(event.key === 'Enter') addComment()">
                        </div>
                        <div id="commentsList">
                            ${renderComments(video.comments || [])}
                        </div>
                    </div>
                </div>
            `;
            
            document.getElementById('mainContent').innerHTML = html;
        }
        
        // Рендер комментариев
        function renderComments(comments) {
            if (comments.length === 0) return '<p style="color: #aaa; text-align: center;">Комментариев пока нет</p>';
            
            let html = '';
            comments.forEach(comment => {
                html += `
                    <div style="display: flex; margin: 15px 0;">
                        <div class="channel-avatar" style="margin-right: 10px;">
                            ${comment.user?.username?.charAt(0) || '?'}
                        </div>
                        <div>
                            <div style="font-weight: bold;">${comment.user?.username || 'Пользователь'}</div>
                            <p>${comment.text}</p>
                            <div style="color: #aaa; font-size: 12px;">
                                ${new Date(comment.createdAt).toLocaleDateString()}
                            </div>
                        </div>
                    </div>
                `;
            });
            return html;
        }
        
        // Авторизация
        function showRegister() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
            document.getElementById('adminLoginForm').style.display = 'none';
        }
        
        function showLogin() {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('adminLoginForm').style.display = 'none';
        }
        
        function showAdminLogin() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('adminLoginForm').style.display = 'block';
        }
        
        async function login() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            if (!email || !password) {
                alert('Заполните все поля');
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    currentUser = data.user;
                    document.getElementById('authBtn').textContent = data.user.username;
                    hideModal('authModal');
                    alert('Вход выполнен успешно!');
                    loadHomePage();
                } else {
                    alert(data.error || 'Ошибка входа');
                }
            } catch (error) {
                alert('Ошибка сервера');
            }
        }
        
        async function register() {
            const username = document.getElementById('regUsername').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            
            if (!username || !email || !password) {
                alert('Заполните все поля');
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert('Регистрация успешна! Теперь войдите в аккаунт');
                    showLogin();
                } else {
                    alert(data.error || 'Ошибка регистрации');
                }
            } catch (error) {
                alert('Ошибка сервера');
            }
        }
        
        // Админ авторизация
        async function adminLogin() {
            const username = document.getElementById('adminUsername').value;
            const password = document.getElementById('adminPassword').value;
            
            try {
                const response = await fetch(`${API_URL}/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    hideModal('authModal');
                    loadAdminPanel();
                } else {
                    alert('Неверные учетные данные');
                }
            } catch (error) {
                alert('Ошибка сервера');
            }
        }
        
        // Загрузка видео
        async function uploadVideo() {
            if (!currentUser) {
                alert('Сначала войдите в аккаунт');
                showModal('authModal');
                return;
            }
            
            const title = document.getElementById('videoTitle').value;
            const description = document.getElementById('videoDescription').value;
            const category = document.getElementById('videoCategory').value;
            const videoUrl = document.getElementById('videoUrl').value;
            
            if (!title || !category) {
                alert('Заполните обязательные поля');
                return;
            }
            
            try {
                const videoData = {
                    userId: currentUser.id,
                    title,
                    description,
                    category,
                    videoUrl: videoUrl || 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4',
                    thumbnailUrl: `https://picsum.photos/300/169?random=${Date.now()}`
                };
                
                const response = await fetch(`${API_URL}/videos`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(videoData)
                });
                
                const video = await response.json();
                
                hideModal('uploadModal');
                alert('Видео успешно загружено!');
                watchVideo(video.id);
            } catch (error) {
                alert('Ошибка загрузки видео');
            }
        }
        
        // Взаимодействия
        async function likeVideo(type) {
            if (!currentUser) {
                alert('Сначала войдите в аккаунт');
                showModal('authModal');
                return;
            }
            
            if (!currentVideo) return;
            
            try {
                await fetch(`${API_URL}/like`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        videoId: currentVideo.id,
                        userId: currentUser.id,
                        type
                    })
                });
                
                alert(type === 1 ? 'Лайк добавлен!' : 'Дизлайк добавлен!');
            } catch (error) {
                alert('Ошибка');
            }
        }
        
        async function toggleSubscribe(channelId) {
            if (!currentUser) {
                alert('Сначала войдите в аккаунт');
                showModal('authModal');
                return;
            }
            
            try {
                const btn = document.getElementById('subscribeBtn');
                const isSubscribed = btn.textContent === 'Отписаться';
                
                const endpoint = isSubscribed ? 'unsubscribe' : 'subscribe';
                
                const response = await fetch(`${API_URL}/${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        subscriberId: currentUser.id,
                        channelId
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    btn.textContent = isSubscribed ? 'Подписаться' : 'Отписаться';
                    alert(isSubscribed ? 'Вы отписались' : 'Вы подписались!');
                }
            } catch (error) {
                alert('Ошибка');
            }
        }
        
        async function addComment() {
            if (!currentUser) {
                alert('Сначала войдите в аккаунт');
                showModal('authModal');
                return;
            }
            
            if (!currentVideo) return;
            
            const input = document.getElementById('commentInput');
            const text = input.value.trim();
            
            if (!text) return;
            
            try {
                const response = await fetch(`${API_URL}/comments`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        videoId: currentVideo.id,
                        userId: currentUser.id,
                        text
                    })
                });
                
                const comment = await response.json();
                
                input.value = '';
                alert('Комментарий добавлен!');
                
                // Обновляем список комментариев
                const commentsList = document.getElementById('commentsList');
                if (commentsList) {
                    commentsList.innerHTML = renderComments([comment]) + commentsList.innerHTML;
                }
            } catch (error) {
                alert('Ошибка добавления комментария');
            }
        }
        
        // Админ панель
        async function loadAdminPanel() {
            showModal('adminModal');
            
            // Базовая авторизация для админ API
            const auth = btoa('admin:AdminSecurePass123!');
            
            try {
                const response = await fetch(`${API_URL}/admin/stats`, {
                    headers: { 'Authorization': `Basic ${auth}` }
                });
                
                const stats = await response.json();
                
                let html = `
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin: 20px 0;">
                        <div style="background: #303030; padding: 20px; border-radius: 10px;">
                            <div style="font-size: 24px; font-weight: bold; color: #ff0000;">${stats.totalUsers}</div>
                            <div style="color: #aaa;">Пользователей</div>
                        </div>
                        <div style="background: #303030; padding: 20px; border-radius: 10px;">
                            <div style="font-size: 24px; font-weight: bold; color: #ff0000;">${stats.totalVideos}</div>
                            <div style="color: #aaa;">Видео</div>
                        </div>
                        <div style="background: #303030; padding: 20px; border-radius: 10px;">
                            <div style="font-size: 24px; font-weight: bold; color: #ff0000;">${formatNumber(stats.totalViews)}</div>
                            <div style="color: #aaa;">Просмотров</div>
                        </div>
                    </div>
                    
                    <h3 style="margin: 20px 0;">Управление видео</h3>
                    <div id="adminVideosList" style="max-height: 300px; overflow-y: auto;"></div>
                `;
                
                document.getElementById('adminContent').innerHTML = html;
                loadAdminVideos();
            } catch (error) {
                document.getElementById('adminContent').innerHTML = '<p style="color: #ff0000;">Ошибка загрузки статистики</p>';
            }
        }
        
        async function loadAdminVideos() {
            const response = await fetch(`${API_URL}/videos?limit=50`);
            const videos = await response.json();
            
            const container = document.getElementById('adminVideosList');
            if (!container) return;
            
            let html = '';
            videos.forEach(video => {
                html += `
                    <div style="display: flex; align-items: center; padding: 10px; border-bottom: 1px solid #303030;">
                        <div style="flex: 1;">
                            <div style="font-weight: bold;">${video.title}</div>
                            <div style="color: #aaa; font-size: 12px;">
                                ${video.channel?.name} • ${formatNumber(video.views)} просмотров
                            </div>
                        </div>
                        <button class="btn secondary" style="padding: 5px 10px; font-size: 12px;" 
                                onclick="deleteVideo('${video.id}')">
                            Удалить
                        </button>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        async function deleteVideo(videoId) {
            if (!confirm('Вы уверены, что хотите удалить это видео?')) return;
            
            try {
                const response = await fetch(`${API_URL}/admin/delete/video/${videoId}`, { 
                    method: 'DELETE' 
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert('Видео удалено');
                    loadAdminVideos();
                }
            } catch (error) {
                alert('Ошибка удаления');
            }
        }
        
        // Вспомогательные функции
        function formatNumber(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num;
        }
        
        function shareVideo() {
            if (navigator.share) {
                navigator.share({
                    title: currentVideo?.title || 'UsTube',
                    text: 'Смотри это видео на UsTube!',
                    url: window.location.href
                });
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert('Ссылка скопирована!');
            }
        }
    </script>
</body>
</html>
