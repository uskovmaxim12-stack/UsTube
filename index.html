<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>UsTube — Современная платформа для видео</title>
    <style>
        /* ===== СБРОС И БАЗОВЫЕ СТИЛИ ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            /* Цветовая схема */
            --primary-red: #FF0000;
            --primary-dark: #0F0F0F;
            --surface-dark: #212121;
            --surface-light: #383838;
            --surface-lighter: #717171;
            --text-primary: #FFFFFF;
            --text-secondary: #AAAAAA;
            --text-disabled: #717171;
            --border-color: #303030;
            --hover-color: rgba(255, 255, 255, 0.1);
            --active-color: rgba(255, 0, 0, 0.1);
            
            /* Градиенты */
            --gradient-primary: linear-gradient(135deg, #FF0000 0%, #CC0000 100%);
            --gradient-dark: linear-gradient(135deg, #0F0F0F 0%, #1A1A1A 100%);
            
            /* Анимации */
            --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-normal: 250ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 350ms cubic-bezier(0.4, 0, 0.2, 1);
            
            /* Скругления */
            --radius-xs: 4px;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --radius-full: 9999px;
            
            /* Отступы */
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 16px;
            --space-lg: 24px;
            --space-xl: 32px;
        }

        /* Светлая тема */
        [data-theme="light"] {
            --primary-red: #FF0000;
            --primary-dark: #FFFFFF;
            --surface-dark: #F9F9F9;
            --surface-light: #F0F0F0;
            --surface-lighter: #E5E5E5;
            --text-primary: #0F0F0F;
            --text-secondary: #606060;
            --text-disabled: #909090;
            --border-color: #E0E0E0;
            --hover-color: rgba(0, 0, 0, 0.05);
            --active-color: rgba(255, 0, 0, 0.08);
            
            --gradient-dark: linear-gradient(135deg, #FFFFFF 0%, #F5F5F5 100%);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background-color: var(--primary-dark);
            color: var(--text-primary);
            line-height: 1.5;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ===== КОМПОНЕНТЫ ===== */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-sm);
            padding: var(--space-sm) var(--space-lg);
            border: none;
            border-radius: var(--radius-full);
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: all var(--transition-fast);
            white-space: nowrap;
        }

        .btn-primary {
            background: var(--gradient-primary);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--surface-light);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: var(--surface-lighter);
        }

        .input {
            width: 100%;
            padding: var(--space-md) var(--space-lg);
            background: var(--surface-dark);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-full);
            color: var(--text-primary);
            font-size: 16px;
            transition: all var(--transition-fast);
        }

        .input:focus {
            outline: none;
            border-color: var(--primary-red);
        }

        /* ===== НАВИГАЦИЯ ===== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: var(--primary-dark);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 var(--space-md);
            gap: var(--space-md);
            z-index: 1000;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            text-decoration: none;
        }

        .logo-icon {
            color: var(--primary-red);
            font-size: 24px;
        }

        .search-container {
            flex: 1;
            max-width: 600px;
        }

        .search-wrapper {
            display: flex;
            gap: var(--space-sm);
        }

        .search-btn {
            width: 64px;
            background: var(--surface-light);
            border: 1px solid var(--border-color);
            border-radius: 0 var(--radius-full) var(--radius-full) 0;
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-full);
            background: var(--primary-red);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            cursor: pointer;
        }

        /* ===== ОСНОВНОЙ КОНТЕНТ ===== */
        .main-content {
            margin-top: 56px;
            padding: var(--space-lg);
        }

        .videos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: var(--space-lg);
            margin-top: var(--space-lg);
        }

        .video-card {
            position: relative;
            background: transparent;
            border-radius: var(--radius-lg);
            overflow: hidden;
            transition: all var(--transition-normal);
            cursor: pointer;
        }

        .video-card:hover {
            transform: translateY(-4px);
        }

        .video-thumbnail {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: var(--surface-light);
            border-radius: var(--radius-md);
            overflow: hidden;
        }

        .video-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform var(--transition-normal);
        }

        .video-card:hover .video-thumbnail img {
            transform: scale(1.05);
        }

        .video-duration {
            position: absolute;
            bottom: var(--space-sm);
            right: var(--space-sm);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 2px 6px;
            border-radius: var(--radius-xs);
            font-size: 12px;
            font-weight: 500;
        }

        .video-info {
            padding: var(--space-sm) 0;
        }

        .video-title {
            font-weight: 500;
            font-size: 16px;
            line-height: 1.4;
            margin-bottom: var(--space-xs);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-meta {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.4;
        }

        /* ===== МОДАЛЬНЫЕ ОКНА ===== */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: var(--space-md);
        }

        .modal-content {
            background: var(--surface-dark);
            border-radius: var(--radius-lg);
            padding: var(--space-xl);
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-lg);
        }

        .modal-title {
            font-size: 20px;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 24px;
            padding: var(--space-xs);
        }

        .form-group {
            margin-bottom: var(--space-lg);
        }

        .form-label {
            display: block;
            margin-bottom: var(--space-sm);
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* ===== СТРАНИЦА ВИДЕО ===== */
        .video-page {
            max-width: 1200px;
            margin: 0 auto;
        }

        .video-player-container {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: var(--radius-lg);
            overflow: hidden;
            margin-bottom: var(--space-lg);
        }

        .video-player {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
        }

        /* ===== АДАПТИВНОСТЬ ===== */
        @media (max-width: 768px) {
            .navbar {
                padding: 0 var(--space-sm);
            }
            
            .logo span {
                display: none;
            }
            
            .main-content {
                padding: var(--space-md);
            }
            
            .videos-grid {
                grid-template-columns: 1fr;
                gap: var(--space-md);
            }
        }

        .hidden {
            display: none !important;
        }

        .text-center {
            text-align: center;
        }

        .text-truncate {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .flex {
            display: flex;
        }

        .items-center {
            align-items: center;
        }

        .justify-between {
            justify-content: space-between;
        }

        .gap-sm {
            gap: var(--space-sm);
        }

        .gap-md {
            gap: var(--space-md);
        }

        .gap-lg {
            gap: var(--space-lg);
        }

        .w-full {
            width: 100%;
        }

        .mt-sm {
            margin-top: var(--space-sm);
        }

        .mt-md {
            margin-top: var(--space-md);
        }

        .mt-lg {
            margin-top: var(--space-lg);
        }

        .mb-sm {
            margin-bottom: var(--space-sm);
        }

        .mb-md {
            margin-bottom: var(--space-md);
        }

        .mb-lg {
            margin-bottom: var(--space-lg);
        }

        /* Скелетон */
        .skeleton {
            background: linear-gradient(90deg, var(--surface-light) 25%, var(--surface-lighter) 50%, var(--surface-light) 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: var(--radius-sm);
        }

        .skeleton-video {
            width: 100%;
            aspect-ratio: 16 / 9;
            margin-bottom: var(--space-sm);
        }

        .skeleton-text {
            height: 16px;
            margin-bottom: var(--space-xs);
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body>
    <!-- Навигация -->
    <nav class="navbar">
        <a href="#" class="logo" onclick="UsTube.goHome()">
            <span class="logo-icon">▶️</span>
            <span>UsTube</span>
        </a>
        
        <div class="search-container">
            <div class="search-wrapper">
                <input type="text" 
                       class="input search-input" 
                       id="searchInput"
                       placeholder="Поиск видео...">
                <button class="btn btn-secondary search-btn" onclick="UsTube.search()">
                    🔍
                </button>
            </div>
        </div>
        
        <div class="user-menu">
            <button class="btn btn-secondary" onclick="UsTube.showUploadModal()">📤 Загрузить</button>
            <div class="avatar" id="userAvatar" onclick="UsTube.toggleUserMenu()">
                ?
            </div>
        </div>
    </nav>

    <!-- Основной контент -->
    <div class="main-content" id="mainContent">
        <!-- Динамический контент -->
        <div id="appContent">
            <div class="fade-in">
                <h1 class="mb-lg">🎬 UsTube Official</h1>
                <div class="flex gap-sm mb-lg">
                    <button class="btn btn-secondary" onclick="UsTube.loadVideos('newest')">Новинки</button>
                    <button class="btn btn-secondary" onclick="UsTube.loadVideos('popular')">Популярные</button>
                    <button class="btn btn-secondary" onclick="UsTube.showShorts()">Shorts</button>
                </div>
                <div id="videosContainer" class="videos-grid">
                    <!-- Видео загружаются здесь -->
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно авторизации -->
    <div class="modal hidden" id="authModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Вход в UsTube</h2>
                <button class="modal-close" onclick="UsTube.hideAuthModal()">×</button>
            </div>
            
            <div id="loginForm">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="input" id="loginEmail" placeholder="example@email.com">
                </div>
                
                <div class="form-group">
                    <label class="form-label">Пароль</label>
                    <input type="password" class="input" id="loginPassword" placeholder="Ваш пароль">
                </div>
                
                <div class="form-group">
                    <button class="btn btn-primary w-full" onclick="UsTube.login()">
                        Войти
                    </button>
                </div>
                
                <div class="text-center mt-md">
                    <span class="text-secondary">Нет аккаунта? </span>
                    <a href="#" onclick="UsTube.showRegisterForm()" style="color: var(--primary-red);">
                        Зарегистрироваться
                    </a>
                </div>
            </div>
            
            <div id="registerForm" class="hidden">
                <div class="form-group">
                    <label class="form-label">Имя пользователя</label>
                    <input type="text" class="input" id="registerUsername" placeholder="Ваше имя">
                </div>
                
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="input" id="registerEmail" placeholder="example@email.com">
                </div>
                
                <div class="form-group">
                    <label class="form-label">Пароль</label>
                    <input type="password" class="input" id="registerPassword" placeholder="Придумайте пароль">
                </div>
                
                <div class="form-group">
                    <button class="btn btn-primary w-full" onclick="UsTube.register()">
                        Зарегистрироваться
                    </button>
                </div>
                
                <div class="text-center mt-md">
                    <a href="#" onclick="UsTube.showLoginForm()" style="color: var(--primary-red);">
                        ← Вернуться к входу
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно загрузки видео -->
    <div class="modal hidden" id="uploadModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Загрузить видео</h2>
                <button class="modal-close" onclick="UsTube.hideUploadModal()">×</button>
            </div>
            
            <div id="uploadArea" style="border: 2px dashed var(--border-color); border-radius: var(--radius-lg); padding: var(--space-2xl); text-align: center; cursor: pointer; margin-bottom: var(--space-lg);"
                 onclick="document.getElementById('videoFile').click()"
                 ondragover="event.preventDefault(); this.style.borderColor='var(--primary-red)';"
                 ondragleave="this.style.borderColor='var(--border-color)';"
                 ondrop="UsTube.handleVideoDrop(event)">
                <div style="font-size: 48px; margin-bottom: var(--space-md);">📤</div>
                <h3>Перетащите видео сюда</h3>
                <p style="color: var(--text-secondary); margin: var(--space-sm) 0;">
                    Или нажмите для выбора файла
                </p>
                <input type="file" id="videoFile" accept="video/*" style="display: none;" onchange="UsTube.handleVideoSelect(event)">
            </div>
            
            <div id="uploadForm" class="hidden">
                <div class="form-group">
                    <label class="form-label">Название видео</label>
                    <input type="text" class="input" id="videoTitle" placeholder="Введите название">
                </div>
                
                <div class="form-group">
                    <label class="form-label">Описание</label>
                    <textarea class="input" id="videoDescription" rows="3" placeholder="Расскажите о видео" style="border-radius: var(--radius-md); resize: vertical;"></textarea>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Категория</label>
                    <select class="input" id="videoCategory" style="border-radius: var(--radius-md);">
                        <option value="">Выберите категорию</option>
                        <option value="Развлечения">Развлечения</option>
                        <option value="Образование">Образование</option>
                        <option value="Музыка">Музыка</option>
                        <option value="Игры">Игры</option>
                        <option value="Спорт">Спорт</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Теги (через запятую)</label>
                    <input type="text" class="input" id="videoTags" placeholder="видео, развлечение, приколы">
                </div>
                
                <div class="form-group">
                    <label class="form-label">
                        <input type="checkbox" id="isShort"> Это короткое видео (Shorts)
                    </label>
                </div>
                
                <button class="btn btn-primary w-full" onclick="UsTube.uploadVideo()" id="uploadBtn">
                    Опубликовать видео
                </button>
            </div>
            
            <!-- Редактор видео -->
            <div id="videoEditor" class="hidden">
                <h3 style="margin-bottom: var(--space-lg);">✂️ Редактор видео</h3>
                
                <div style="background: var(--primary-dark); border-radius: var(--radius-md); padding: var(--space-md); margin-bottom: var(--space-lg);">
                    <video id="editorPreview" controls style="width: 100%; border-radius: var(--radius-sm);"></video>
                </div>
                
                <div class="editor-controls" style="display: flex; gap: var(--space-sm); flex-wrap: wrap; margin-bottom: var(--space-lg);">
                    <button class="btn btn-secondary" onclick="UsTube.trimVideo()">
                        <span>✂️</span> Обрезать
                    </button>
                    <button class="btn btn-secondary" onclick="UsTube.addText()">
                        <span>📝</span> Текст
                    </button>
                    <button class="btn btn-secondary" onclick="UsTube.addMusic()">
                        <span>🎵</span> Музыка
                    </button>
                    <button class="btn btn-secondary" onclick="UsTube.addFilter()">
                        <span>🎨</span> Фильтр
                    </button>
                </div>
                
                <button class="btn btn-primary w-full" onclick="UsTube.finishEditing()">
                    Завершить редактирование
                </button>
            </div>
        </div>
    </div>

    <!-- Модальное окно настроек канала -->
    <div class="modal hidden" id="channelModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">⚙️ Настройки канала</h2>
                <button class="modal-close" onclick="UsTube.hideChannelModal()">×</button>
            </div>
            
            <div class="text-center mb-lg">
                <div id="channelAvatar" class="avatar" style="width: 100px; height: 100px; font-size: 36px; margin: 0 auto var(--space-md); cursor: pointer;" 
                     onclick="document.getElementById('avatarUpload').click()">
                    👤
                </div>
                <input type="file" id="avatarUpload" accept="image/*" style="display: none;" onchange="UsTube.handleAvatarUpload(event)">
                
                <div id="channelBanner" style="height: 150px; background: var(--surface-light); border-radius: var(--radius-md); margin-bottom: var(--space-md); cursor: pointer; display: flex; align-items: center; justify-content: center;"
                     onclick="document.getElementById('bannerUpload').click()">
                    <span style="color: var(--text-secondary);">🏞️ Нажмите чтобы загрузить баннер</span>
                </div>
                <input type="file" id="bannerUpload" accept="image/*" style="display: none;" onchange="UsTube.handleBannerUpload(event)">
            </div>
            
            <div class="form-group">
                <label class="form-label">Название канала</label>
                <input type="text" class="input" id="channelName" placeholder="Название вашего канала">
            </div>
            
            <div class="form-group">
                <label class="form-label">Описание канала</label>
                <textarea class="input" id="channelBio" rows="4" placeholder="Расскажите о своем канале" style="border-radius: var(--radius-md); resize: vertical;"></textarea>
            </div>
            
            <button class="btn btn-primary w-full" onclick="UsTube.saveChannelSettings()">
                Сохранить изменения
            </button>
        </div>
    </div>

    <script>
        const UsTube = {
            // Конфигурация
            API_URL: 'http://localhost:3000/api',
            currentUser: null,
            currentVideo: null,
            
            // Инициализация
            async init() {
                this.loadHomePage();
                this.checkAuth();
                this.setupEventListeners();
                console.log('🎬 UsTube инициализирован');
            },
            
            // Проверка авторизации
            async checkAuth() {
                const user = localStorage.getItem('ustube_user');
                if (user) {
                    this.currentUser = JSON.parse(user);
                    this.updateUserUI();
                }
            },
            
            updateUserUI() {
                const avatar = document.getElementById('userAvatar');
                if (this.currentUser) {
                    avatar.textContent = this.currentUser.username.charAt(0).toUpperCase();
                    if (this.currentUser.isAdmin) {
                        avatar.style.background = 'linear-gradient(135deg, #FF0000, #FF6B6B)';
                    }
                }
            },
            
            // Навигация
            goHome() {
                this.loadHomePage();
            },
            
            async loadHomePage() {
                const html = `
                    <div class="fade-in">
                        <div class="flex items-center justify-between mb-lg">
                            <h1>🎬 UsTube Official</h1>
                            ${this.currentUser?.isAdmin ? 
                                `<button class="btn btn-secondary" onclick="UsTube.showAdminPanel()">🔧 Админ панель</button>` : ''}
                        </div>
                        
                        <div class="flex gap-sm mb-lg">
                            <button class="btn btn-secondary" onclick="UsTube.loadVideos('newest')">Новинки</button>
                            <button class="btn btn-secondary" onclick="UsTube.loadVideos('popular')">Популярные</button>
                            <button class="btn btn-secondary" onclick="UsTube.showShorts()">Shorts</button>
                            <button class="btn btn-secondary" onclick="UsTube.showRecommendations()">Рекомендации</button>
                        </div>
                        
                        <div id="videosContainer">
                            ${this.getSkeletonVideos(6)}
                        </div>
                    </div>
                `;
                
                document.getElementById('appContent').innerHTML = html;
                await this.loadVideos('newest');
            },
            
            getSkeletonVideos(count) {
                let html = '<div class="videos-grid">';
                for(let i = 0; i < count; i++) {
                    html += `
                        <div class="video-card">
                            <div class="video-thumbnail skeleton"></div>
                            <div class="video-info">

            async login() {
                const email = document.getElementById('loginEmail').value;
                const password = document.getElementById('loginPassword').value;
                
                if (!email || !password) {
                    this.showMessage('Заполните все поля', 'error');
                    return;
                }
                
                try {
                    const response = await fetch(`${this.API_URL}/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        this.currentUser = data.user;
                        localStorage.setItem('ustube_user', JSON.stringify(data.user));
                        this.updateUserUI();
                        this.hideAuthModal();
                        this.showMessage('Вход выполнен успешно!', 'success');
                        
                        document.getElementById('loginEmail').value = '';
                        document.getElementById('loginPassword').value = '';
                        
                        this.goHome();
                    } else {

                } catch (error) {
                    console.error('Ошибка входа:', error);
                    this.showMessage('Ошибка сервера', 'error');
                }

                const email = document.getElementById('registerEmail').value;
                const password = document.getElementById('registerPassword').value;

                    this.showMessage('Заполните все поля', 'error');
                    return;

                try {
                    const response = await fetch(`${this.API_URL}/register`, {
                        method: 'POST',

                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {

            logout() {

                this.currentUser = null;

            toggleUserMenu() {
                if (!this.currentUser) {
                    this.showAuthModal();
                    return;
                }
                
                // Простое меню пользователя
                const actions = [
                    { label: 'Мой канал', action: () => this.showChannel(this.currentUser.id) },
                    { label: 'Настройки канала', action: () => this.showChannelSettings() },
                    { separator: true },
                    { label: 'Выйти', action: () => this.logout() }
                ];
                
                // Показываем простое меню через prompt
                let menu = 'Выберите действие:\n\n';
                actions.forEach((action, index) => {
                    if (action.separator) {
                        menu += '────────────\n';
                    } else {
                        menu += `${index + 1}. ${action.label}\n`;
                    }
                });
                
                const choice = prompt(menu);
                if (choice) {
                    const index = parseInt(choice) - 1;
                    if (index >= 0 && index < actions.length && !actions[index].separator) {
                        actions[index].action();
                    }
                }
            },

            showUploadModal() {
                if (!this.currentUser) {
                    this.showAuthModal();
                    return;
                }
                
                document.getElementById('uploadModal').classList.remove('hidden');
                document.getElementById('uploadForm').classList.add('hidden');
                document.getElementById('videoEditor').classList.add('hidden');
            },
            
            hideUploadModal() {
                document.getElementById('uploadModal').classList.add('hidden');
            },
            
            handleVideoSelect(event) {
                const file = event.target.files[0];
                if (file) {
                    this.processVideoFile(file);
                }
            },
            
            handleVideoDrop(event) {
                event.preventDefault();
                event.target.style.borderColor = 'var(--border-color)';
                
                const file = event.dataTransfer.files[0];
                if (file) {
                    this.processVideoFile(file);
                }
            },
            
            async processVideoFile(file) {
                if (!file.type.startsWith('video/')) {
                    this.showMessage('Выберите видео файл', 'error');
                    return;
                }
                
                document.getElementById('uploadForm').classList.remove('hidden');
                document.getElementById('videoTitle').value = file.name.replace(/\.[^/.]+$/, "");
                
                // Показываем предпросмотр
                const video = document.getElementById('editorPreview');
                if (video) {
                    video.src = URL.createObjectURL(file);
                    video.load();
                    document.getElementById('videoEditor').classList.remove('hidden');
                }
            },
            
            async uploadVideo() {
                const title = document.getElementById('videoTitle').value.trim();
                const description = document.getElementById('videoDescription').value;
                const category = document.getElementById('videoCategory').value;
                const tags = document.getElementById('videoTags').value;
                const isShort = document.getElementById('isShort').checked;
                
                if (!title) {
                    this.showMessage('Введите название видео', 'error');
                    return;
                }
                
                const formData = new FormData();
                formData.append('title', title);
                formData.append('description', description);
                formData.append('channelId', this.currentUser.id);
                formData.append('category', category);
                formData.append('tags', tags);
                formData.append('isShort', isShort);
                
                // Добавляем видео файл
                const videoFile = document.getElementById('videoFile').files[0];
                if (videoFile) {
                    formData.append('video', videoFile);
                }
                
                try {
                    const response = await fetch(`${this.API_URL}/upload/video`, {
                        method: 'POST',
                        body: formData
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        this.showMessage('Видео успешно загружено!', 'success');
                        setTimeout(() => {
                            this.hideUploadModal();
                            this.goHome();
                        }, 1500);
                    } else {
                        this.showMessage('Ошибка загрузки видео', 'error');
                    }
                } catch (error) {
                    console.error('Ошибка:', error);
                    this.showMessage('Ошибка сервера', 'error');
                }
            },

                            <!-- Информация о канале -->
                            <div class="flex items-start justify-between mb-lg">
                                <div class="flex items-center gap-md">
                                    <div class="avatar" style="width: 80px; height: 80px; font-size: 32px;">
                                        ${channel.username.charAt(0)}
                                    </div>
                                    <div>
                                        <h1 style="display: flex; align-items: center; gap: var(--space-xs);">
                                            ${channel.username}
                                            ${channel.isVerified ? '<span style="color: var(--primary-red);">✓</span>' : ''}
                                        </h1>
                                        <div class="video-meta">
                                            @${channel.username.toLowerCase().replace(/\s+/g, '_')} • 
                                            ${this.formatNumber(channel.subscribers)} подписчиков • 
                                            ${channel.videos.length + channel.shorts.length} видео
                                        </div>
                                    </div>
                                </div>
                                
                                ${this.currentUser && this.currentUser.id !== channel.id ? `
                                    <button class="btn ${channel.isSubscribed ? 'btn-secondary' : 'btn-primary'}" 
                                            onclick="UsTube.toggleSubscribe('${channel.id}')">
                                        ${channel.isSubscribed ? 'Отписаться' : 'Подписаться'}
                                    </button>
                                ` : ''}
                                
                                ${this.currentUser && this.currentUser.id === channel.id ? `
                                    <button class="btn btn-secondary" onclick="UsTube.showChannelSettings()">
                                        ⚙️ Настройки
                                    </button>
                                ` : ''}
                            </div>
                            
                            <!-- Описание -->
                            ${channel.bio ? `
                                <div class="mb-lg">
                                    <p style="color: var(--text-secondary);">${channel.bio}</p>
                                </div>
                            ` : ''}
                            
                            <!-- Видео канала -->
                            <h2 class="mb-lg">🎬 Видео (${channel.videos.length})</h2>
                            ${channel.videos.length > 0 ? 
                                this.displayVideos(channel.videos) : 
                                '<p class="text-center text-secondary">На этом канале пока нет видео</p>'
                            }
                            
                            <!-- Shorts канала -->
                            ${channel.shorts.length > 0 ? `
                                <h2 class="mb-lg mt-xl">🎥 Shorts (${channel.shorts.length})</h2>
                                ${this.displayShorts(channel.shorts)}
                            ` : ''}
                        </div>
                    `;
                    
                    document.getElementById('appContent').innerHTML = html;
                    
                } catch (error) {
                    console.error('Ошибка загрузки канала:', error);
                    this.showMessage('Ошибка загрузки канала', 'error');
                }
            },
            
            // Настройки канала
            showChannelSettings() {
                if (!this.currentUser) {
                    this.showAuthModal();
                    return;
                }
                
                document.getElementById('channelModal').classList.remove('hidden');
                document.getElementById('channelName').value = this.currentUser.username;
                document.getElementById('channelBio').value = this.currentUser.bio || '';
                
                const avatar = document.getElementById('channelAvatar');
                if (this.currentUser.avatar && this.currentUser.avatar !== '/uploads/avatars/default.png') {
                    avatar.innerHTML = `<img src="${this.currentUser.avatar}" style="width: 100%; height: 100%; border-radius: 50%;">`;
                }
                
                const banner = document.getElementById('channelBanner');
                if (this.currentUser.banner && this.currentUser.banner !== '/uploads/banners/default.jpg') {
                    banner.innerHTML = `<img src="${this.currentUser.banner}" style="width: 100%; height: 100%; border-radius: var(--radius-md);">`;
                }
            },
            
            hideChannelModal() {
                document.getElementById('channelModal').classList.add('hidden');
            },
            
            handleAvatarUpload(event) {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const avatar = document.getElementById('channelAvatar');
                        avatar.innerHTML = `<img src="${e.target.result}" style="width: 100%; height: 100%; border-radius: 50%;">`;
                    };
                    reader.readAsDataURL(file);
                }
            },
            
            handleBannerUpload(event) {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const banner = document.getElementById('channelBanner');
                        banner.innerHTML = `<img src="${e.target.result}" style="width: 100%; height: 100%; border-radius: var(--radius-md);">`;
                    };
                    reader.readAsDataURL(file);
                }
            },
            
            async saveChannelSettings() {
                const username = document.getElementById('channelName').value.trim();
                const bio = document.getElementById('channelBio').value;
                
                if (!username) {
                    this.showMessage('Введите название канала', 'error');
                    return;
                }
                
                const formData = new FormData();
                formData.append('userId', this.currentUser.id);
                formData.append('username', username);
                formData.append('bio', bio);
                
                // Добавляем аватар
                const avatarFile = document.getElementById('avatarUpload').files[0];
                if (avatarFile) {
                    formData.append('avatar', avatarFile);
                }
                
                // Добавляем баннер
                const bannerFile = document.getElementById('bannerUpload').files[0];
                if (bannerFile) {
                    formData.append('banner', bannerFile);
                }
                
                try {
                    const response = await fetch(`${this.API_URL}/channel/update`, {
                        method: 'POST',
                        body: formData
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        this.currentUser = data.user;
                        localStorage.setItem('ustube_user', JSON.stringify(data.user));
                        this.updateUserUI();
                        this.showMessage('Настройки сохранены', 'success');
                        setTimeout(() => {
                            this.hideChannelModal();
                            this.showChannel(this.currentUser.id);
                        }, 1000);
                    }
                } catch (error) {
                    console.error('Ошибка сохранения:', error);
                    this.showMessage('Ошибка сохранения', 'error');
                }
            },
            
            // Админ панель
            async showAdminPanel() {
                if (!this.currentUser?.isAdmin) {
                    this.showMessage('Требуются права администратора', 'error');
                    return;
                }
                
                // Проверяем пароль
                const password = prompt('Введите пароль администратора:');
                if (!password) return;
                
                try {
                    const response = await fetch(`${this.API_URL}/admin/check/${encodeURIComponent(password)}`);
                    const data = await response.json();
                    
                    if (data.success) {
                        // Открываем админ панель в новом окне
                        window.open(`/admin.html?password=${password}`, '_blank');
                    } else {
                        this.showMessage('Неверный пароль', 'error');
                    }
                } catch (error) {
                    console.error('Ошибка проверки пароля:', error);
                    this.showMessage('Ошибка сервера', 'error');
                }
            },
            
            // Вспомогательные функции
            formatNumber(num) {
                if (num >= 1000000) return (num / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
                if (num >= 1000) return (num / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
                return num.toString();
            },
            
            formatTimeAgo(timestamp) {
                const seconds = Math.floor((Date.now() - timestamp) / 1000);
                
                if (seconds < 60) return 'только что';
                if (seconds < 3600) return Math.floor(seconds / 60) + ' мин. назад';
                if (seconds < 86400) return Math.floor(seconds / 3600) + ' ч. назад';
                if (seconds < 2592000) return Math.floor(seconds / 86400) + ' дн. назад';
                if (seconds < 31536000) return Math.floor(seconds / 2592000) + ' мес. назад';
                return Math.floor(seconds / 31536000) + ' г. назад';
            },
            
            formatDuration(seconds) {
                if (!seconds) return '0:00';
                
                const hrs = Math.floor(seconds / 3600);
                const mins = Math.floor((seconds % 3600) / 60);
                const secs = Math.floor(seconds % 60);
                
                if (hrs > 0) {
                    return `${hrs}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                }
                return `${mins}:${secs.toString().padStart(2, '0')}`;
            },
            
            showMessage(message, type = 'info') {
                alert(`${type === 'error' ? '❌' : type === 'success' ? '✅' : 'ℹ️'} ${message}`);
            },
            
            setupEventListeners() {
                // Поиск при нажатии Enter
                document.getElementById('searchInput')?.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.search();
                    }
                });
                
                // Закрытие модальных окон
                document.querySelectorAll('.modal').forEach(modal => {
                    modal.addEventListener('click', (e) => {
                        if (e.target === modal) {
                            modal.classList.add('hidden');
                        }
                    });
                });
                
                // Обработка Escape
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        document.querySelectorAll('.modal').forEach(modal => {
                            modal.classList.add('hidden');
                        });
                    }
                });
            }
        };

        // Инициализация
        document.addEventListener('DOMContentLoaded', () => {
            UsTube.init();
        });
    </script>
</body>
</html>
