<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USTube - Видеохостинг</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <header class="yt-header">
            <div class="yt-header-left">
                <button class="yt-menu-btn" id="menuToggle">
                    <i class="fas fa-bars"></i>
                </button>
                <a href="/" class="yt-logo">
                    <div class="yt-logo-icon">
                        <i class="fab fa-youtube"></i>
                    </div>
                    <div class="yt-logo-text">USTube</div>
                </a>
            </div>
            
            <div class="yt-search-container">
                <form class="yt-search-form" id="searchForm">
                    <input type="text" class="yt-search-input" placeholder="Поиск" id="searchInput">
                    <button type="submit" class="yt-search-btn">
                        <i class="fas fa-search"></i>
                    </button>
                </form>
                <button class="yt-voice-search" title="Голосовой поиск">
                    <i class="fas fa-microphone"></i>
                </button>
            </div>
            
            <div class="yt-header-right">
                <button class="yt-header-icon" id="createVideoBtn" title="Создать">
                    <i class="fas fa-video"></i>
                </button>
                <button class="yt-header-icon" id="themeToggle" title="Сменить тему">
                    <i class="fas fa-moon"></i>
                </button>
                <div class="yt-user-avatar" id="userAvatar" title="Войти">?</div>
            </div>
        </header>

        <main class="yt-main">
            <div class="yt-tags">
                <span class="yt-tag active">Все</span>
                <span class="yt-tag">Музыка</span>
                <span class="yt-tag">Игры</span>
                <span class="yt-tag">Обучение</span>
                <span class="yt-tag">Новости</span>
            </div>
            
            <div class="yt-video-grid" id="videoGrid">
                <!-- Видео загружаются через JS -->
            </div>
        </main>

        <div class="yt-modal" id="authModal">
            <div class="yt-modal-content">
                <div class="yt-modal-header">
                    <h2 class="yt-modal-title" id="authModalTitle">Вход в USTube</h2>
                    <button class="yt-modal-close" id="closeAuthModal">&times;</button>
                </div>
                
                <div id="authForm">
                    <div class="yt-form-group">
                        <label class="yt-form-label">Email</label>
                        <input type="email" class="yt-form-input" id="authEmail" placeholder="email@example.com">
                    </div>
                    
                    <div class="yt-form-group">
                        <label class="yt-form-label">Пароль</label>
                        <input type="password" class="yt-form-input" id="authPassword" placeholder="Введите пароль">
                    </div>
                    
                    <div class="yt-form-group" id="authUsernameGroup" style="display: none;">
                        <label class="yt-form-label">Имя пользователя</label>
                        <input type="text" class="yt-form-input" id="authUsername" placeholder="Введите имя">
                    </div>
                    
                    <div id="authError" class="yt-form-group" style="color: #FF0000; display: none;"></div>
                    
                    <div style="display: flex; gap: 12px; margin-top: 24px;">
                        <button class="yt-btn secondary" id="authToggleBtn">Создать аккаунт</button>
                        <button class="yt-btn" id="authSubmitBtn">Войти</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/script.js"></script>
</body>
</html>
